[tools]
air = "1.64.5"
"aqua:a-h/templ" = "0.3.1001"
dbmate = "2.31.0"
go = "1.27"
golangci-lint = "2.14.0"
oapi-codegen = "2.8.0"
node = "24"
pnpm = "12.11.2"

[vars]
app_version = "0.1.0"

[env]
_.file = ".env"

[tasks.build]
description = "Builds serverplate's binary for production use in the current machine's architecture"
run = "mkdir -p ./build && go build -ldflags='-w -s' -v -o ./build/serverplate ./cmd"

[tasks.generate]
description = "Runs all code generation targets"
run = "templ generate && oapi-codegen -config oapicodegen.config.yaml openapi.yaml"

[tasks.test]
description = "Runs all serverplate tests"
run = "go test ./..."

[tasks.coverage]
description = "Tests serverplate codebase and generates a coverage file"
run = "mkdir -p ./build && go test -coverprofile=./build/coverage.out ./..."

[tasks.see_coverage]
description = "Showcases the coverage in a browser using html output"
depends = ["coverage"]
run = "go tool cover -html=./build/coverage.out"

[tasks.clean]
description = "Removes build assets generated by the build target from the system"
run = "rm -rf ./build/*"

[tasks.lint]
description = "Detects flaws in the code and checks for style"
run = "golangci-lint run"

[tasks.format]
description = "Formats the codebase using golangci-lint linters"
run = "golangci-lint run --fix && templ fmt ./internal/templates"

[tasks.docker]
description = "Builds the application's docker image"
run = "docker build --no-cache --progress=plain -t davidonium/serverplate:{{vars.app_version}} . && docker tag davidonium/serverplate:{{vars.app_version}} davidonium/serverplate:latest"

[tasks.'db:migrate']
description = "Applies database migrations"
run = "dbmate up"

[tasks.'db:reset']
description = "Recreates the current database and applies migrations, useful for development (WARN: destroys data)"
run = "dbmate drop && dbmate create && dbmate up"

[tasks.'db:seed']
description = "Seed adjectives/nouns tables"
run = "go run ./cmd seed"

[tasks.dev]
description = "Launches the app with support for live reload of the server on file change"
run = "air"

[tasks.'dev:frontend']
description = "Runs the frontend with support for live reload of assets on file change"
run = "pnpm -C frontend dev"
